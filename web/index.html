<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Deals Network</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /*
     * Real-metal plate textures.
     * Each plate layers three things, back to front:
     *  1. a repeating-linear-gradient at a slight angle - the fine
     *     "brushed metal" streaks a flat gradient alone can't fake.
     *  2. the brand-tone gradient (gold / silver / navy).
     *  3. box-shadow: an inset highlight (top-left, like light
     *     catching a raised edge), an inset shadow (bottom-right,
     *     like the edge falling into shade), and an outer drop
     *     shadow so the whole plate reads as sitting proud of the
     *     page rather than flat against it.
     */
    .plate-amazon-gold {
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,0.18) 0px, rgba(255,255,255,0.18) 1px, transparent 1px, transparent 4px),
        linear-gradient(135deg, #6b4d18 0%, #cfa043 22%, #fff1aa 42%, #e0bd63 58%, #a37930 78%, #543c11 100%);
      border: 1.5px solid #43300e;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.9),
        inset 0 -3px 5px rgba(0, 0, 0, 0.5),
        0 6px 14px rgba(0, 0, 0, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .plate-brushed-silver {
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 1px, transparent 1px, transparent 3px),
        linear-gradient(135deg, #5c6166 0%, #a8aeb3 20%, #ffffff 42%, #eef0f2 50%, #c1c7cc 65%, #85898e 85%, #4d5155 100%);
      border: 1.5px solid #4d5155;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -3px 5px rgba(0, 0, 0, 0.45),
        0 6px 14px rgba(0, 0, 0, 0.28),
        0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .plate-bestbuy-navy {
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px, transparent 1px, transparent 4px),
        linear-gradient(135deg, #020810 0%, #153c69 30%, #1e4a7d 48%, #0c2b4d 68%, #020810 100%);
      border: 1.5px solid #010509;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.25),
        inset 0 -3px 5px rgba(0, 0, 0, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.4);
    }

    /* Metal screws/rivets - deeper socket + brighter catch-light so
       they read as recessed metal, not flat dots. */
    .screw {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d4d8db 30%, #8a9096 55%, #3e4348 80%, #1c1f22 100%);
      box-shadow:
        inset 0 1px 1.5px rgba(0, 0, 0, 0.9),
        inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.6),
        0 0.5px 1px rgba(255, 255, 255, 0.5);
    }

    .screw-tl { top: 7px; left: 7px; }
    .screw-tr { top: 7px; right: 7px; }
    .screw-bl { bottom: 7px; left: 7px; }
    .screw-br { bottom: 7px; right: 7px; }
  </style>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen w-full m-0 p-0 antialiased">

  <!-- Full Width Edge-to-Edge Container -->
  <div class="w-full max-w-md mx-auto min-h-screen bg-white flex flex-col justify-start">
    
    <!-- Hero Banner -->
    <div class="relative w-full h-44 bg-cover bg-center flex flex-col justify-center px-6 py-4" 
         style="background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=80');">
      <h1 class="text-white text-sm font-black tracking-widest leading-snug font-serif uppercase">
        CURATED DEALS,<br>
        AMERICA'S<br>
        CRAFTSMANSHIP
      </h1>
      <p class="text-[9px] text-gray-400 tracking-widest uppercase mt-2 font-semibold">
        GLOBAL DEALS NETWORK
      </p>
    </div>

    <!-- Category Icons Section -->
    <div class="w-full px-4 py-4 bg-white">
      <div class="grid grid-cols-4 gap-2.5">
        
        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center">
          <i class="fa-solid fa-laptop text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">TECH</span>
        </div>

        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center">
          <i class="fa-solid fa-shirt text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">FASHION</span>
        </div>

        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center">
          <i class="fa-solid fa-house text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">HOME</span>
        </div>

        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center">
          <i class="fa-solid fa-earth-americas text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">SPORTS</span>
        </div>

      </div>
    </div>

    <!-- Same-To-Same Metallic Plates Grid -->
    <div class="w-full px-4 pb-8">
      <div class="grid grid-cols-2 gap-4">

        <!-- 1. Amazon Gold Metallic Plate -->
        <div class="text-center">
          <div class="plate-amazon-gold rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>
            
            <div class="flex flex-col items-center pt-1">
              <span class="text-2xl font-black text-black tracking-tighter leading-none">amazon</span>
              <!-- Smile Arrow -->
              <svg class="w-12 h-3.5 text-[#ff9900]" viewBox="0 0 100 30" fill="none">
                <path d="M 10 8 Q 50 30 90 8" stroke="#ff9900" stroke-width="8" stroke-linecap="round"/>
                <path d="M 80 4 L 95 10 L 85 20 Z" fill="#ff9900"/>
              </svg>
            </div>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            EXCLUSIVE TECH<br>DISCOUNTS
          </p>
        </div>

        <!-- 2. Nike Silver Metallic Plate -->
        <div class="text-center">
          <div class="plate-brushed-silver rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>
            
            <!-- Exact Nike Swoosh SVG -->
            <svg class="w-16 h-10 fill-black" viewBox="0 0 24 24">
              <path d="M21.707 5.293a1 1 0 010 1.414l-11 11a1 1 0 01-1.414 0l-5-5a1 1 0 111.414-1.414L10 15.586 20.293 5.293a1 1 0 011.414 0z"/>
            </svg>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            SEASONAL<br>ATHLETIC OFFERS
          </p>
        </div>

        <!-- 3. Samsung Silver Metallic Plate -->
        <div class="text-center">
          <div class="plate-brushed-silver rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>
            
            <span class="text-xl font-black text-[#034ea2] tracking-widest uppercase">SAMSUNG</span>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            PREMIUM<br>ELECTRONICS DEALS
          </p>
        </div>

        <!-- 4. Airbnb Silver Metallic Plate -->
        <div class="text-center">
          <div class="plate-brushed-silver rounded-2xl h-24 relative flex flex-col items-center justify-center p-3 mb-2">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>
            
            <i class="fa-brands fa-airbnb text-2xl text-[#FF5A5F] mb-0.5"></i>
            <span class="text-xs font-bold text-[#FF5A5F] tracking-tight">airbnb</span>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            PREMIUM<br>ATHLETIC OFFERS
          </p>
        </div>

        <!-- 5. Walmart Silver Metallic Plate -->
        <div class="text-center">
          <div class="plate-brushed-silver rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>
            
            <div class="flex items-center">
              <span class="text-xl font-black text-[#0071dc] tracking-tight">Walmart</span>
              <svg class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="none" stroke="#ffc220" stroke-width="2.4" stroke-linecap="round">
                <path d="M12 2v20M3.5 7l17 10M20.5 7l-17 10M2 12h20M4.5 3.5l15 17M19.5 3.5l-15 17"/>
              </svg>
            </div>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            WALMART
          </p>
        </div>

        <!-- 6. Best Buy Navy Blue Metallic Plate -->
        <div class="text-center">
          <div class="plate-bestbuy-navy rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>
            
            <div class="relative flex flex-col items-center justify-center">
              <span class="text-lg font-black text-white leading-none tracking-tight">BEST</span>
              <span class="text-lg font-black text-white leading-none tracking-tight">BUY</span>
              <!-- Yellow price-tag icon, replacing the earlier text badge -->
              <svg class="absolute -bottom-2.5 -right-5" width="20" height="20" viewBox="0 0 24 24" fill="#fff200" stroke="#0a1d3b" stroke-width="0.6">
                <path d="M3 4h8l10 10-8 8L3 12V4z"/>
                <circle cx="7.5" cy="8.5" r="1.6" fill="#0a1d3b" stroke="none"/>
              </svg>
            </div>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            BEST BUY
          </p>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
