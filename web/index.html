<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Deals - Premium Landing Page</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Premium Metallic Plate Styles */
    .gold-plate {
      background: linear-gradient(135deg, #d4af37 0%, #fff3a3 35%, #aa7c11 100%);
      border: 1px solid #b8860b;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    
    .silver-plate {
      background: linear-gradient(135deg, #cfd9df 0%, #e2ebf0 40%, #a1a8ad 100%);
      border: 1px solid #9aa0a6;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 0 4px 10px rgba(0, 0, 0, 0.12);
    }
    
    .blue-plate {
      background: linear-gradient(135deg, #0d2a4a 0%, #174174 50%, #051329 100%);
      border: 1px solid #081d38;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    /* Metallic Screw/Rivet Details */
    .rivet {
      width: 5px;
      height: 5px;
      background: #5b6268;
      border-radius: 50%;
      box-shadow: inset 1px 1px 1px rgba(0,0,0,0.8), 0.5px 0.5px 1px rgba(255,255,255,0.8);
    }
  </style>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen w-full m-0 p-0 antialiased">

  <!-- Main Container: Full Width Edge-to-Edge -->
  <div class="w-full max-w-md mx-auto min-h-screen bg-white flex flex-col justify-start">
    
    <!-- Hero Section -->
    <div class="relative w-full h-44 bg-cover bg-center flex flex-col justify-center px-6 py-4" 
         style="background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=80');">
      <h1 class="text-white text-sm font-black tracking-widest leading-snug font-serif uppercase">
        CURATED DEALS,<br>
        AMERICICS<br>
        CRAFTSMSNSHIP
      </h1>
      <p class="text-[9px] text-gray-400 tracking-widest uppercase mt-2 font-semibold">
        GLOBAL SELECT NETWORK
      </p>
    </div>

    <!-- Category Section (Tech, Fashion, Home, Sports) -->
    <div class="w-full px-4 py-4 bg-white">
      <div class="grid grid-cols-4 gap-2.5">
        
        <!-- Tech -->
        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center shadow-xs">
          <i class="fa-solid fa-laptop text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">TECH</span>
        </div>

        <!-- Fashion -->
        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center shadow-xs">
          <i class="fa-solid fa-shirt text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">FASHION</span>
        </div>

        <!-- Home -->
        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center shadow-xs">
          <i class="fa-solid fa-house text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">HOME</span>
        </div>

        <!-- Sports -->
        <div class="bg-[#f2f4f7] rounded-2xl p-3 flex flex-col items-center justify-center text-center shadow-xs">
          <i class="fa-solid fa-earth-americas text-gray-700 text-xl mb-1.5"></i>
          <span class="text-[10px] font-black tracking-wider text-gray-800 uppercase">SPORTS</span>
        </div>

      </div>
    </div>

    <!-- Metallic Brand Grid -->
    <div class="w-full px-4 pb-8 space-y-4">
      <div class="grid grid-cols-2 gap-3.5">

        <!-- 1. Amazon Card -->
        <div class="text-center">
          <div class="gold-plate rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="absolute top-2 left-2 rivet"></div>
            <div class="absolute top-2 right-2 rivet"></div>
            <div class="absolute bottom-2 left-2 rivet"></div>
            <div class="absolute bottom-2 right-2 rivet"></div>
            
            <span class="text-2xl font-black text-black tracking-tighter">amazon</span>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            EXCLUSIVE TECH<br>DISCOUNTS
          </p>
        </div>

        <!-- 2. Nike Card -->
        <div class="text-center">
          <div class="silver-plate rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="absolute top-2 left-2 rivet"></div>
            <div class="absolute top-2 right-2 rivet"></div>
            <div class="absolute bottom-2 left-2 rivet"></div>
            <div class="absolute bottom-2 right-2 rivet"></div>
            
            <!-- Nike Swoosh SVG -->
            <svg class="w-14 h-10 fill-black" viewBox="0 0 24 24">
              <path d="M21.707 6.293a1 1 0 00-1.414 0L9.5 17.086l-4.793-4.793a1 1 0 00-1.414 1.414l5.5 5.5a1 1 0 001.414 0l11.5-11.5a1 1 0 000-1.414z"/>
            </svg>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            SEASONAL<br>ATHLETIC OFFERS
          </p>
        </div>

        <!-- 3. Samsung Card -->
        <div class="text-center">
          <div class="silver-plate rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="absolute top-2 left-2 rivet"></div>
            <div class="absolute top-2 right-2 rivet"></div>
            <div class="absolute bottom-2 left-2 rivet"></div>
            <div class="absolute bottom-2 right-2 rivet"></div>
            
            <span class="text-lg font-black text-[#034ea2] tracking-wider uppercase">SAMSUNG</span>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            PREMIUM<br>ELECTRONICS DEALS
          </p>
        </div>

        <!-- 4. Airbnb Card -->
        <div class="text-center">
          <div class="silver-plate rounded-2xl h-24 relative flex flex-col items-center justify-center p-3 mb-2">
            <div class="absolute top-2 left-2 rivet"></div>
            <div class="absolute top-2 right-2 rivet"></div>
            <div class="absolute bottom-2 left-2 rivet"></div>
            <div class="absolute bottom-2 right-2 rivet"></div>
            
            <i class="fa-brands fa-airbnb text-2xl text-[#FF5A5F] mb-0.5"></i>
            <span class="text-xs font-bold text-[#FF5A5F] tracking-tight">airbnb</span>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            PREMIUM<br>ATHLETIC OFFERS
          </p>
        </div>

        <!-- 5. Walmart Card -->
        <div class="text-center">
          <div class="silver-plate rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="absolute top-2 left-2 rivet"></div>
            <div class="absolute top-2 right-2 rivet"></div>
            <div class="absolute bottom-2 left-2 rivet"></div>
            <div class="absolute bottom-2 right-2 rivet"></div>
            
            <span class="text-lg font-black text-[#0071dc] tracking-tight">
              Walmart<span class="text-[#ffc220] font-black ml-0.5">*</span>
            </span>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            WALMART
          </p>
        </div>

        <!-- 6. Best Buy Card -->
        <div class="text-center">
          <div class="blue-plate rounded-2xl h-24 relative flex items-center justify-center p-3 mb-2">
            <div class="absolute top-2 left-2 rivet"></div>
            <div class="absolute top-2 right-2 rivet"></div>
            <div class="absolute bottom-2 left-2 rivet"></div>
            <div class="absolute bottom-2 right-2 rivet"></div>
            
            <div class="text-center">
              <span class="text-base font-black text-white leading-none block tracking-tight">BEST</span>
              <span class="text-base font-black text-white leading-none block tracking-tight">BUY</span>
            </div>
          </div>
          <p class="text-[10px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            BEST BUY
          </p>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
