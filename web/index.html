<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Deals - Mobile View</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Custom Metallic Textures & Metallic Plate Styling */
    .gold-card {
      background: linear-gradient(135deg, #e5ca76 0%, #fffbd8 40%, #b8860b 100%);
      border: 1px solid #c59b27;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 6px rgba(0,0,0,0.15);
    }
    
    .silver-card {
      background: linear-gradient(135deg, #e2e8f0 0%, #ffffff 50%, #cbd5e1 100%);
      border: 1px solid #94a3b8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 6px rgba(0,0,0,0.12);
    }
    
    .dark-blue-card {
      background: linear-gradient(135deg, #0a2540 0%, #1e3a8a 50%, #030b1e 100%);
      border: 1px solid #1e293b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.2);
    }

    /* Metallic Screw/Rivet Effect on Corners */
    .rivet {
      width: 4px;
      height: 4px;
      background: #71717a;
      border-radius: 50%;
      box-shadow: inset 1px 1px 1px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body class="bg-gray-200 flex justify-center items-center min-h-screen p-2 sm:p-6 font-sans">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-[390px] bg-white rounded-[36px] shadow-2xl overflow-hidden border-[6px] border-gray-900">
    
    <!-- Top Hero Banner -->
    <div class="relative bg-gray-900 text-white p-6 bg-cover bg-center h-36 flex flex-col justify-center" 
         style="background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=800&q=80');">
      <h1 class="text-base font-bold tracking-wider uppercase leading-tight font-serif text-gray-100">
        Curated Deals,<br>Americics<br>Craftsmsnship
      </h1>
      <p class="text-[9px] text-gray-400 mt-1 tracking-widest uppercase">Global Select Network</p>
    </div>

    <div class="p-4 space-y-5">
      
      <!-- Top Categories Grid (Tech, Fashion, Home, Sports) -->
      <div class="grid grid-cols-4 gap-2">
        
        <div class="bg-gray-100 p-2.5 rounded-xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-200">
          <i class="fa-solid fa-laptop text-gray-700 text-lg mb-1"></i>
          <span class="text-[10px] font-extrabold tracking-wider text-gray-800">TECH</span>
        </div>

        <div class="bg-gray-100 p-2.5 rounded-xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-200">
          <i class="fa-solid fa-shirt text-gray-700 text-lg mb-1"></i>
          <span class="text-[10px] font-extrabold tracking-wider text-gray-800">FASHION</span>
        </div>

        <div class="bg-gray-100 p-2.5 rounded-xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-200">
          <i class="fa-solid fa-house text-gray-700 text-lg mb-1"></i>
          <span class="text-[10px] font-extrabold tracking-wider text-gray-800">HOME</span>
        </div>

        <div class="bg-gray-100 p-2.5 rounded-xl flex flex-col items-center justify-center text-center shadow-xs border border-gray-200">
          <i class="fa-solid fa-earth-americas text-gray-700 text-lg mb-1"></i>
          <span class="text-[10px] font-extrabold tracking-wider text-gray-800">SPORTS</span>
        </div>

      </div>

      <!-- Brand Metallic Cards Grid -->
      <div class="grid grid-cols-2 gap-3">

        <!-- 1. Amazon Card -->
        <div class="text-center">
          <div class="gold-card rounded-xl h-20 relative flex items-center justify-center p-2 mb-1.5">
            <div class="absolute top-1.5 left-1.5 rivet"></div>
            <div class="absolute top-1.5 right-1.5 rivet"></div>
            <div class="absolute bottom-1.5 left-1.5 rivet"></div>
            <div class="absolute bottom-1.5 right-1.5 rivet"></div>
            
            <span class="text-2xl font-black text-black tracking-tighter">amazon</span>
          </div>
          <p class="text-[9px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            Exclusive Tech<br>Discounts
          </p>
        </div>

        <!-- 2. Nike Card -->
        <div class="text-center">
          <div class="silver-card rounded-xl h-20 relative flex items-center justify-center p-2 mb-1.5">
            <div class="absolute top-1.5 left-1.5 rivet"></div>
            <div class="absolute top-1.5 right-1.5 rivet"></div>
            <div class="absolute bottom-1.5 left-1.5 rivet"></div>
            <div class="absolute bottom-1.5 right-1.5 rivet"></div>
            
            <!-- Nike Swoosh -->
            <svg class="w-12 h-12 fill-black" viewBox="0 0 24 24">
              <path d="M21.707 5.293a1 1 0 010 1.414l-11 11a1 1 0 01-1.414 0l-5-5a1 1 0 111.414-1.414L10 15.586 20.293 5.293a1 1 0 011.414 0z"/>
            </svg>
          </div>
          <p class="text-[9px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            Seasonal<br>Athletic Offers
          </p>
        </div>

        <!-- 3. Samsung Card -->
        <div class="text-center">
          <div class="silver-card rounded-xl h-20 relative flex items-center justify-center p-2 mb-1.5">
            <div class="absolute top-1.5 left-1.5 rivet"></div>
            <div class="absolute top-1.5 right-1.5 rivet"></div>
            <div class="absolute bottom-1.5 left-1.5 rivet"></div>
            <div class="absolute bottom-1.5 right-1.5 rivet"></div>
            
            <span class="text-base font-black text-blue-900 tracking-widest uppercase">SAMSUNG</span>
          </div>
          <p class="text-[9px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            Premium<br>Electronics Deals
          </p>
        </div>

        <!-- 4. Airbnb Card -->
        <div class="text-center">
          <div class="silver-card rounded-xl h-20 relative flex flex-col items-center justify-center p-2 mb-1.5">
            <div class="absolute top-1.5 left-1.5 rivet"></div>
            <div class="absolute top-1.5 right-1.5 rivet"></div>
            <div class="absolute bottom-1.5 left-1.5 rivet"></div>
            <div class="absolute bottom-1.5 right-1.5 rivet"></div>
            
            <i class="fa-brands fa-airbnb text-2xl text-red-500"></i>
            <span class="text-xs font-bold text-red-500 tracking-tight">airbnb</span>
          </div>
          <p class="text-[9px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            Premium<br>Athletic Offers
          </p>
        </div>

        <!-- 5. Walmart Card -->
        <div class="text-center">
          <div class="silver-card rounded-xl h-20 relative flex items-center justify-center p-2 mb-1.5">
            <div class="absolute top-1.5 left-1.5 rivet"></div>
            <div class="absolute top-1.5 right-1.5 rivet"></div>
            <div class="absolute bottom-1.5 left-1.5 rivet"></div>
            <div class="absolute bottom-1.5 right-1.5 rivet"></div>
            
            <span class="text-lg font-black text-blue-600 tracking-tight">Walmart<span class="text-yellow-500 font-bold">*</span></span>
          </div>
          <p class="text-[9px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            Walmart
          </p>
        </div>

        <!-- 6. Best Buy Card -->
        <div class="text-center">
          <div class="dark-blue-card rounded-xl h-20 relative flex flex-col items-center justify-center p-2 mb-1.5">
            <div class="absolute top-1.5 left-1.5 rivet"></div>
            <div class="absolute top-1.5 right-1.5 rivet"></div>
            <div class="absolute bottom-1.5 left-1.5 rivet"></div>
            <div class="absolute bottom-1.5 right-1.5 rivet"></div>
            
            <span class="text-sm font-black text-white leading-none tracking-tight">BEST</span>
            <span class="text-sm font-black text-white leading-none tracking-tight">BUY</span>
          </div>
          <p class="text-[9px] font-black text-gray-900 leading-tight tracking-wider uppercase">
            Best Buy
          </p>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
